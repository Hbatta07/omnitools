<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="OmniTool — private browser-based image and PDF utilities"><title>OmniTool — Private Media Suite</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}.drop-active{border-color:#818cf8!important;background:rgba(99,102,241,.1)!important;box-shadow:0 0 0 3px rgba(99,102,241,.12)}.custom-scrollbar::-webkit-scrollbar{width:6px}.custom-scrollbar::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:999px}button:disabled{opacity:.55;cursor:not-allowed}</style>
</head>
<body class="min-h-screen bg-[#09090b] text-zinc-50 antialiased">
<header class="sticky top-0 z-50 border-b border-zinc-800 bg-[#09090b]/90 backdrop-blur"><div class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-3 px-4 sm:px-6"><div class="flex items-center gap-3"><div class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm font-bold text-zinc-950">OT</div><b class="text-sm">OmniTool</b><span class="rounded-full border border-zinc-800 bg-zinc-900 px-2 py-0.5 font-mono text-xs text-zinc-500">v1.1</span></div><nav class="flex rounded-xl border border-zinc-800 bg-zinc-900 p-1"><button id="navImage" class="rounded-lg bg-zinc-800 px-3 py-1.5 text-xs font-medium text-white sm:px-4" onclick="category('image')">Image Studio</button><button id="navPdf" class="rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-400 sm:px-4" onclick="category('pdf')">PDF Suite</button></nav><div class="hidden items-center gap-2 text-xs text-zinc-500 sm:flex"><i class="h-2 w-2 rounded-full bg-emerald-500"></i>Runs locally</div></div></header>
<main class="mx-auto flex w-full max-w-5xl flex-1 flex-col items-center px-4 py-8 sm:px-6"><div id="notice" class="mb-5 hidden w-full max-w-3xl rounded-xl border px-4 py-3 text-xs" role="status" aria-live="polite"></div>
<section id="imageSection" class="flex w-full max-w-3xl flex-col gap-6"><div class="flex flex-wrap justify-center gap-2"><button id="itCompress" onclick="imgTool('compress')" class="tab-active">Compressor</button><button id="itConvert" onclick="imgTool('convert')" class="tab">Format Converter</button><button id="itResize" onclick="imgTool('resize')" class="tab">Dimension Resizer</button></div>
<div id="imageDrop" class="drop border-2 border-dashed border-zinc-800 bg-zinc-950/50 p-10 sm:p-12"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" class="absolute inset-0 cursor-pointer opacity-0"><div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-400">↥</div><p class="text-sm font-medium">Drop your image here, or <span class="text-indigo-400 underline">browse</span></p><p class="mt-1 text-xs text-zinc-500">JPG, PNG, WebP • Maximum 25 MB</p></div>
<div id="imageWork" class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5 sm:p-6"><div class="flex flex-col gap-6 md:flex-row"><div class="relative flex min-h-[260px] flex-1 flex-col items-center justify-center rounded-xl border border-zinc-800 bg-[#09090b] p-4"><img id="preview" class="max-h-[220px] max-w-full rounded-lg object-contain" alt="Preview"><div class="mt-3 flex gap-3 font-mono text-xs text-zinc-500"><span id="meta"></span><span>•</span><span id="size"></span></div><button onclick="resetImage()" class="absolute right-3 top-3 rounded border border-zinc-800 bg-zinc-900 px-2 py-1 text-xs text-zinc-400 hover:text-white">Replace</button></div><div class="flex w-full flex-col justify-between gap-6 md:w-80"><div id="compressControls"><div class="flex justify-between text-xs"><label for="quality" class="font-medium text-zinc-400">Quality</label><span id="qualityText" class="font-mono">80%</span></div><input id="quality" type="range" min="10" max="100" value="80" class="mt-3 w-full accent-indigo-500"><div class="mt-4 flex justify-between rounded-lg border border-zinc-800 bg-zinc-950 p-3 text-xs"><span class="text-zinc-400">Estimated output</span><span id="estimate" class="font-mono text-emerald-400">—</span></div></div><div id="convertControls" class="hidden"><label class="text-xs font-medium text-zinc-400">Convert to</label><div class="mt-3 grid grid-cols-3 gap-2"><button id="jpg" onclick="target='image/jpeg';setFormats()" class="format-active">JPG</button><button id="png" onclick="target='image/png';setFormats()" class="format">PNG</button><button id="webp" onclick="target='image/webp';setFormats()" class="format">WebP</button></div></div><div id="resizeControls" class="hidden"><div class="grid grid-cols-2 gap-3"><label class="text-xs text-zinc-400">Width<input id="rw" type="number" min="1" class="field"></label><label class="text-xs text-zinc-400">Height<input id="rh" type="number" min="1" class="field"></label></div><label class="mt-3 flex items-center gap-2 text-xs text-zinc-400"><input id="lock" type="checkbox" checked class="accent-indigo-500"> Lock aspect ratio</label></div><button id="imageAction" onclick="processImage()" class="w-full rounded-xl bg-white py-2.5 text-xs font-medium text-zinc-950 hover:bg-zinc-200">Download Processed File</button></div></div></div></section>
<section id="pdfSection" class="hidden flex w-full max-w-3xl flex-col gap-6"><div class="flex justify-center gap-2"><button id="pdfMergeTab" onclick="pdfTool('merge')" class="tab-active">PDF Merger</button><button id="pdfImgTab" onclick="pdfTool('img2pdf')" class="tab">Images to PDF</button></div><div id="pdfDrop" class="drop border-2 border-dashed border-zinc-800 bg-zinc-950/50 p-10"><input id="pdfInput" type="file" multiple class="absolute inset-0 cursor-pointer opacity-0"><div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-400">PDF</div><p id="pdfTitle" class="text-sm font-medium">Drop PDF files here, or <span class="text-indigo-400 underline">browse</span></p><p id="pdfHint" class="mt-1 text-xs text-zinc-500">Select multiple PDFs to merge into one</p></div><div id="queue" class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5 sm:p-6"><div class="flex justify-between border-b border-zinc-800 pb-3 text-xs"><b class="uppercase tracking-wider text-zinc-400">Queue (<span id="count">0</span>)</b><button onclick="clearQueue()" class="text-rose-400">Clear All</button></div><div id="list" class="custom-scrollbar mt-4 flex max-h-60 flex-col gap-2 overflow-y-auto"></div><button id="pdfAction" onclick="processPdf()" class="mt-4 w-full rounded-xl bg-white py-2.5 text-xs font-medium text-zinc-950">Merge & Download Single PDF</button></div></section></main><footer class="border-t border-zinc-800 py-6 text-center text-xs text-zinc-500">Built client-side • Files are processed in your browser</footer>
<script>
const MAX=25*1024*1024,IMAGES=['image/jpeg','image/png','image/webp'],PDF=['application/pdf'];let current=null,img=null,tool='compress',target='image/jpeg',pdfMode='merge',queue=[];
const $=x=>document.getElementById(x);const tabs='rounded-lg border px-3.5 py-1.5 text-xs font-medium';const base=t=>`${tabs} ${t?'border-indigo-500/30 bg-indigo-500/10 text-indigo-300':'border-zinc-800 text-zinc-400 hover:bg-zinc-900'}`;document.head.insertAdjacentHTML('beforeend','<style>.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:1rem;text-align:center;cursor:pointer;transition:.2s}.tab,.tab-active,.format,.format-active{border-radius:.5rem;padding:.375rem .875rem;font-size:.75rem;font-weight:500}.tab,.format{border:1px solid #27272a;color:#a1a1aa}.tab-active,.format-active{border:1px solid rgba(99,102,241,.3);background:rgba(99,102,241,.1);color:#a5b4fc}.field{display:block;width:100%;margin-top:.3rem;border:1px solid #27272a;background:#18181b;border-radius:.5rem;padding:.5rem .75rem;color:white;font-family:monospace;font-size:.75rem;outline:none}</style>');
function notice(m,ok=false){let n=$('notice');n.textContent=m;n.className=`mb-5 w-full max-w-3xl rounded-xl border px-4 py-3 text-xs ${ok?'border-emerald-500/30 bg-emerald-500/10 text-emerald-300':'border-rose-500/30 bg-rose-500/10 text-rose-300'}`;clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.add('hidden'),4500)}
function bytes(n){if(!n)return'0 B';let u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(1024));return`${(n/1024**i).toFixed(i?1:0)} ${u[i]}`}
function valid(files,types){return files.filter(f=>{if(f.size>MAX){notice(`${f.name} is larger than 25 MB.`);return false}if(!types.includes(f.type)){notice(`${f.name}: unsupported file type.`);return false}return true})}
function category(c){$('imageSection').classList.toggle('hidden',c!=='image');$('pdfSection').classList.toggle('hidden',c!=='pdf');$('navImage').className=base(c==='image');$('navPdf').className=base(c==='pdf')}
function imgTool(t){tool=t;['compress','convert','resize'].forEach(x=>{$('it'+x[0].toUpperCase()+x.slice(1)).className=base(x===t);$('compressControls').classList.toggle('hidden',t!=='compress');$('convertControls').classList.toggle('hidden',t!=='convert');$('resizeControls').classList.toggle('hidden',t!=='resize')});if(img)estimate()}
function pdfTool(t){pdfMode=t;clearQueue();$('pdfMergeTab').className=base(t==='merge');$('pdfImgTab').className=base(t==='img2pdf');$('pdfInput').accept=t==='merge'?'application/pdf':'image/jpeg,image/png,image/webp';$('pdfTitle').innerHTML=t==='merge'?'Drop PDF files here, or <span class="text-indigo-400 underline">browse</span>':'Drop images here, or <span class="text-indigo-400 underline">browse</span>';$('pdfHint').textContent=t==='merge'?'Select multiple PDFs to merge into one':'Select JPG, PNG or WebP images to combine into a PDF';$('pdfAction').textContent=t==='merge'?'Merge & Download Single PDF':'Generate & Download PDF'}
function loadImage(files){let f=valid(files,IMAGES)[0];if(!f)return;current=f;let r=new FileReader();r.onerror=()=>notice('Could not read that image.');r.onload=e=>{let x=new Image();x.onerror=()=>notice('The image could not be decoded.');x.onload=()=>{img=x;$('preview').src=e.target.result;$('meta').textContent=`${x.naturalWidth} × ${x.naturalHeight}px`;$('size').textContent=bytes(f.size);$('rw').value=x.naturalWidth;$('rh').value=x.naturalHeight;$('imageDrop').classList.add('hidden');$('imageWork').classList.remove('hidden');estimate()};x.src=e.target.result};r.readAsDataURL(f)}
function resetImage(){$('imageInput').value='';current=null;img=null;$('imageDrop').classList.remove('hidden');$('imageWork').classList.add('hidden');$('estimate').textContent='—'}
function mime(){return tool==='convert'?target:(tool==='compress'&&current.type==='image/png'?'image/png':current.type==='image/webp'&&target==='image/webp'?'image/webp':tool==='resize'&&current.type==='image/png'?'image/png':'image/jpeg')}
function blob(canvas,m,q){return new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('Browser could not export this image.')),m,q))}
async function makeBlob(){let w=img.naturalWidth,h=img.naturalHeight;if(tool==='resize'){w=parseInt($('rw').value);h=parseInt($('rh').value);if(!w||!h||w<1||h<1)throw Error('Enter valid dimensions.')}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');if(!ctx)throw Error('Canvas is unavailable.');let m=mime();if(m==='image/jpeg') {ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}ctx.drawImage(img,0,0,w,h);return blob(c,m,parseInt($('quality').value)/100)}
async function estimate(){if(!img)return;$('qualityText').textContent=$('quality').value+'%';try{$('estimate').textContent=bytes((await makeBlob()).size)}catch{$('estimate').textContent='Unavailable'}}
async function processImage(){if(!img)return notice('Choose an image first.');let b=$('imageAction');b.disabled=true;b.textContent='Processing…';try{let out=await makeBlob(),ext=mime().split('/')[1].replace('jpeg','jpg'),u=URL.createObjectURL(out),a=document.createElement('a');a.href=u;a.download=`omnitool_${Date.now()}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice('File processed and downloaded. ✓',true)}catch(e){notice(e.message||'Image processing failed.')}finally{b.disabled=false;b.textContent='Download Processed File'}}
function setFormats(){['jpg','png','webp'].forEach(x=>$(x).className=base(target===({'jpg':'image/jpeg','png':'image/png','webp':'image/webp'})[x]));estimate()}
function addPdf(files){let good=valid(files,pdfMode==='merge'?PDF:IMAGES);queue.push(...good);renderQueue()}
function renderQueue(){let l=$('list');l.replaceChildren();$('count').textContent=queue.length;$('queue').classList.toggle('hidden',!queue.length);queue.forEach((f,i)=>{let r=document.createElement('div');r.className='flex items-center justify-between rounded-lg border border-zinc-800 bg-zinc-950 p-2.5 text-xs';let n=document.createElement('span');n.className='truncate font-medium';n.textContent=`${i+1}. ${f.name} (${bytes(f.size)})`;let x=document.createElement('button');x.className='ml-3 text-zinc-500 hover:text-rose-400';x.textContent='×';x.onclick=()=>{queue.splice(i,1);renderQueue()};r.append(n,x);l.append(r)})}
function clearQueue(){$('pdfInput').value='';queue=[];renderQueue()}
async function imageJpeg(f){if(f.type==='image/jpeg')return f.arrayBuffer();let bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0);bm.close();return(await blob(c,'image/jpeg',.95)).arrayBuffer()}
async function processPdf(){if(!queue.length)return notice('Add at least one file first.');if(typeof PDFLib==='undefined')return notice('PDF engine failed to load. Reload while online.');let b=$('pdfAction');b.disabled=true;b.textContent='Processing…';try{let out=await PDFLib.PDFDocument.create();if(pdfMode==='merge'){for(let f of queue){let d=await PDFLib.PDFDocument.load(await f.arrayBuffer());let ps=await out.copyPages(d,d.getPageIndices());ps.forEach(p=>out.addPage(p))}}else{for(let f of queue){let data=await f.arrayBuffer();let im=f.type==='image/png'?await out.embedPng(data):await out.embedJpg(f.type==='image/webp'?await imageJpeg(f):data);let p=out.addPage([im.width,im.height]);p.drawImage(im,{x:0,y:0,width:im.width,height:im.height})}}let data=await out.save(),u=URL.createObjectURL(new Blob([data],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=`omnitool_${Date.now()}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice('PDF created and downloaded. ✓',true)}catch(e){console.error(e);notice('Could not process these files. Check that PDFs are valid and not password protected.')}finally{b.disabled=false;b.textContent=pdfMode==='merge'?'Merge & Download Single PDF':'Generate & Download PDF'}}
function drop(zone,input,fn){['dragenter','dragover'].forEach(e=>zone.addEventListener(e,x=>{x.preventDefault();zone.classList.add('drop-active')}));['dragleave','drop'].forEach(e=>zone.addEventListener(e,x=>{x.preventDefault();zone.classList.remove('drop-active');if(e==='drop')fn([...x.dataTransfer.files])}));input.addEventListener('change',e=>{fn([...e.target.files]);input.value=''})}
$('quality').addEventListener('input',estimate);$('rw').addEventListener('input',()=>{if($('lock').checked&&img)$('rh').value=Math.max(1,Math.round($('rw').value*img.naturalHeight/img.naturalWidth))});$('rh').addEventListener('input',()=>{if($('lock').checked&&img)$('rw').value=Math.max(1,Math.round($('rh').value*img.naturalWidth/img.naturalHeight))});drop($('imageDrop'),$('imageInput'),loadImage);drop($('pdfDrop'),$('pdfInput'),addPdf);
</script></body></html>
